events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. Перенаправляем весь HTTP (порт 80) на HTTPS (порт 443)
    server {
        listen 80;
        server_name fishlove.localhost;
        return 301 https://$host$request_uri;
    }

    # 2. Настройки HTTPS
    server {
        listen 443 ssl;
        server_name fishlove.localhost;

        # Пути к сертификатам внутри контейнера (мы примонтируем их через docker-compose)
        ssl_certificate /etc/nginx/certs/fishlove.localhost.pem;
        ssl_certificate_key /etc/nginx/certs/fishlove.localhost-key.pem;

        # Максимальный размер загружаемых файлов (для картинок)
        client_max_body_size 10M;

        location / {
            # Передаем запросы вашему Node.js приложению (app - это имя сервиса в docker-compose)
            proxy_pass http://app:5000;
            
            # Передаем заголовки, чтобы Express знал реальный IP и протокол
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}