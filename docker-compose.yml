version: '3.8'

services:
  # 1. Ваше Node.js приложение
  app:
    build: .
    container_name: fishlove_app
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SECRET_KEY=dev-secret-key-123
      - FIREBASE_KEY_PATH=/app/firebase_key.json
    volumes:
      # Монтируем ключ Firebase (только для чтения)
      - ./firebase_key.json:/app/firebase_key.json:ro
      # Монтируем папку для картинок, чтобы они не пропадали при перезапуске
      - ./public/uploads:/app/public/uploads
    networks:
      - fishlove_network
    # Порт 5000 наружу НЕ открываем! Nginx будет обращаться к нему внутри сети.

  # 2. Веб-сервер Nginx
  nginx:
    image: nginx:alpine
    container_name: fishlove_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Монтируем наш конфиг
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Монтируем сертификаты, которые мы только что создали
      - ./fishlove.localhost.pem:/etc/nginx/certs/fishlove.localhost.pem:ro
      - ./fishlove.localhost-key.pem:/etc/nginx/certs/fishlove.localhost-key.pem:ro
    depends_on:
      - app
    networks:
      - fishlove_network

networks:
  fishlove_network:
    driver: bridge