<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>РыбаLove - Каталог</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header>
        <div class="logo">РЫБАLOVE</div>
        <div class="search-bar">
            <input type="text" placeholder="Поиск снастей...">
            <button>
                <a href="/serch" class="icon-link" title="Поиск">
                    <img src="/static/icons/Serch.png" alt="Поиск">
                </a>
            </button>
        </div>
        <div class="icons">
            <a href="/map" class="icon-link" title="Карта">
                <img src="/static/icons/Map.png" alt="Карта">
            </a>
            <a href="#" class="icon-link" title="Сообщения">
                <img src="/static/icons/Chat.png" alt="Сообщения">
            </a>
            <a href="/cart" class="icon-link" title="Корзина">
                <img src="/static/icons/Cart.png" alt="Корзина">
            </a>
            <a href="/profile" class="icon-link" title="Профиль">
                <img src="/static/icons/Profile.png" alt="Профиль">
            </a>
        </div>
    </header>

    <main class="catalog-grid">
        {% for product in products %}
        <div class="product-card">
            <div class="product-image">Фото</div>
            <h3>{{ product[1] }}</h3>
            <p class="price">{{ product[2] }} ₽</p>
            <button class="btn-add">В корзину</button>
        </div>
        {% endfor %}

        {% if not products %}
        <div class="product-card">
            <div class="product-image"></div>
            <h3>Спиннинг</h3>
            <p class="price">5000 ₽</p>
        </div>
        <div class="product-card">
            <div class="product-image"></div>
            <h3>Блесна</h3>
            <p class="price">300 ₽</p>
        </div>
        <div class="product-card">
            <div class="product-image"></div>
            <h3>Леска</h3>
            <p class="price">800 ₽</p>
        </div>
        {% endif %}
    </main>
</body>

</html>
